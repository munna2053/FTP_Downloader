services:
  ftp-http-downloader:
    build:
      context: .
    container_name: ftp-http-downloader
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      FTP_DOWNLOADER_HOST: "0.0.0.0"
      FTP_DOWNLOADER_PORT: "8080"
      FTP_DOWNLOADER_DB: "/data/downloader.sqlite"
    volumes:
      - /srv/Media:/app/downloads
      - ./database:/data
    deploy:
      resources:
        limits:
          memory: 256M
